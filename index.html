<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Robotic project" />

    <title>Robotic</title>
    <link rel="icon" href="./public/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="./public/favicon/apple-touch-icon.png">
    <link rel="manifest" href="./public/favicon/site.webmanifest">

    <script>
      (function() {
        var key = 'app-theme';
        var theme = null;

        try {
          var stored = localStorage.getItem(key);
          if (stored === 'dark' || stored === 'light' || stored === 'system') {
            theme = stored;
          }
        } catch (e) {}

        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!theme || theme === 'system') theme = prefersDark ? 'dark' : 'light';

        var el = document.documentElement;
        el.setAttribute('data-theme', theme);
        el.style.colorScheme = (theme === 'dark') ? 'dark' : 'light';

        var css = ':root { background-color: ' + (theme === 'dark' ? '#000000' : '#ffffff') + '; }';
        var s = document.createElement('style');
        s.setAttribute('data-theme-init', '1');
        s.appendChild(document.createTextNode(css));
        (document.head || document.documentElement).appendChild(s);
      })();
    </script>
  </head>
  <body>


    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
